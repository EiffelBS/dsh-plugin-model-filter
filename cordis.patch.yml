# dsh-plugin-model-filter bundle patch, applied as a profile layer after
# dsh-web-app in `dsh.profile.bundles` order (see `dsh plugin` reconciliation).
#
# V2 design: coexist with the stock `ui-model-selection` row instead of
# disabling it. The official package stays the single source of truth for the
# `modelDirectories` service, the `/model` command and the `model` locale
# namespace; this bundle only occupies the `conversation.input.model` seat
# (rendered last, so it wins) with the searchable ModelSelect. Because this
# bundle no longer provides the service other bundles depend on
# (@nanmicoder/dsh-agent-teams waits for `modelDirectories`), disabling or
# removing this plugin is safe — the stock row simply takes the seat back and
# boot never loses the provider.
#
# The insert row is the only edit. `applyEntryPatches` pushes insert lists at
# the root after the shipped rows, so this row is activated last and its slot
# registration (elected for `kind: single` seats by latest registration) wins
# over the stock `ui-model-selection` slot.
- insert:
    - id: ui-model-filter
      name: 'dsh-plugin-model-filter'